name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-rust-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git
      - name: Build and test
        run: |
          cargo build --verbose --all-features --workspace
          cargo test --verbose --all-features --workspace

  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git
      # Skips rather than fails while the repo has no test workspace
      # configured. Once it is, switch to a hard failure so a missing secret
      # can't turn this job silently green.
      - name: Check the test workspace
        id: workspace
        env:
          BRAZE_API_KEY: ${{ secrets.BRAZE_API_KEY }}
          BRAZE_BASE_URL: ${{ vars.BRAZE_BASE_URL }}
        run: |
          if [ -n "$BRAZE_API_KEY" ] && [ -n "$BRAZE_BASE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::BRAZE_API_KEY secret or BRAZE_BASE_URL variable is not set, skipping live integration tests"
          fi
      - name: Run integration tests
        if: steps.workspace.outputs.configured == 'true'
        env:
          BRAZE_API_KEY: ${{ secrets.BRAZE_API_KEY }}
          BRAZE_BASE_URL: ${{ vars.BRAZE_BASE_URL }}
        # The live tests are `#[ignore]`d; `--ignored` runs only them, since
        # the mocks already ran in `test-rust-latest`. `--test '*'` picks up
        # every file under `braze/tests/` without editing this workflow.
        run: cargo test --verbose --all-features -p braze --test '*' -- --ignored

  test-rust-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # `cargo +nightly` overrides the stable pin in `rust-toolchain.toml`.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git
      - name: Build and test
        run: |
          cargo +nightly build --verbose --all-features --workspace
          cargo +nightly test --verbose --all-features --workspace

  # Checks the `rust-version` in `Cargo.toml`, so a dependency bump that
  # raises it fails here rather than for users.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git
      - name: Compile with MSRV
        run: cargo +1.89 check --workspace --all-targets --all-features --locked --verbose

  # Builds each crate on its own, like `cargo publish`.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt-get -qq install pkg-config libssl-dev git
      - name: Package and verify each crate
        run: cargo package --workspace --locked
