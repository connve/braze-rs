[package]
name = "braze"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "braze"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
export = ["_api"]
messaging = ["_api"]
trace = ["dep:tracing", "tracing/attributes"]
# Internal: enabled by every API feature. Gates the shared request plumbing,
# which is unused when no API is enabled. Not meant to be enabled directly.
_api = []

[dependencies]
braze_generated = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
tracing = { workspace = true, optional = true }
chrono = { workspace = true }
secrecy = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
wiremock = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "export_users"
path = "../examples/braze/export_users.rs"
required-features = ["export"]

[[example]]
name = "export_segment"
path = "../examples/braze/export_segment.rs"
required-features = ["export"]

[[test]]
name = "export"
path = "tests/export.rs"
required-features = ["export"]

[[test]]
name = "mock_export"
path = "tests/mock_export.rs"
required-features = ["export"]

[[example]]
name = "trigger_campaign"
path = "../examples/braze/trigger_campaign.rs"
required-features = ["messaging"]

[[test]]
name = "messaging"
path = "tests/messaging.rs"
required-features = ["messaging"]

[[test]]
name = "mock_messaging"
path = "tests/mock_messaging.rs"
required-features = ["messaging"]
